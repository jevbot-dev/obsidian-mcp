# Build the release from the tagged commit, attest where it came from, publish.
#
# The zip is reproducible (scripts/build.mjs), so anyone can rebuild a tag with
# `npm ci && npm run package` and get the same sha256, and check the release
# with `gh attestation verify <zip> -R jevbot-dev/obsidian-mcp`.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: obsidian-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag does not match package.json"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Check reproducibility
        run: |
          first=$(sha256sum release/obsidian-mcp-*.zip | cut -d' ' -f1)
          npm run package
          second=$(sha256sum release/obsidian-mcp-*.zip | cut -d' ' -f1)
          test "$first" = "$second"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obsidian-mcp-${{ env.VERSION }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/obsidian-mcp-${{ env.VERSION }}.zip
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=release/obsidian-mcp-$VERSION.zip
          sha=$(cut -d' ' -f1 "$zip.sha256")
          {
            echo "Obsidian app bridge: list/select vaults, search and read notes, create and append with readback verification."
            echo "Includes read-only Jevbot A2UI views for vault lists, search results and verified note edits."
            echo
            echo "Requires Obsidian 1.12.7+ with the official CLI enabled. Uninstalling the bridge preserves Obsidian and all notes."
            echo "Built from $GITHUB_SHA; verify with gh attestation verify $zip -R $GITHUB_REPOSITORY."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag "$zip" "$zip.sha256" "release/obsidian-mcp-$VERSION.catalog.json" --title "Obsidian bridge $VERSION" --notes-file notes.md
          { echo "sha256 \`$sha\`"; echo; echo '```json'; cat "release/obsidian-mcp-$VERSION.catalog.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
